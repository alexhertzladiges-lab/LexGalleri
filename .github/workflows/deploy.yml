name: Deploy PHP via FTPS
on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: 'Kontrollér kun FTPS-login, TLS og offentlig kontorod; overfør ingen filer'
        type: boolean
        required: true
        default: true
      test_web3:
        description: 'Test kun web3.e-studio.dk i diagnose-tilstand; behold ellers den gemte server'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: lexgalleri-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && !inputs.diagnostic_only
    uses: ./.github/workflows/tests.yml
  transfer:
    if: ${{ always() && github.ref == 'refs/heads/main' && !cancelled() && (inputs.diagnostic_only || needs.checks.result == 'success') }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTPS_HOST: ${{ inputs.diagnostic_only && inputs.test_web3 && 'web3.e-studio.dk' || vars.FTPS_HOST }}
      FTPS_USERNAME: ${{ vars.FTPS_USERNAME }}
      FTPS_PORT: ${{ vars.FTPS_PORT }}
      FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FTPS settings
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
        run: |
          if [[ "$DIAGNOSTIC_ONLY" == "true" ]]; then
            node scripts/ftps-plan.mjs "$RUNNER_TEMP/lexgalleri-ftps-preflight" --diagnose
          else
            node scripts/ftps-plan.mjs "$RUNNER_TEMP/lexgalleri-ftps-preflight"
          fi
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Check connection or transfer code
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
        run: |
          if [[ "$DIAGNOSTIC_ONLY" == "true" ]]; then
            bash scripts/deploy-ftps.sh --diagnose
          else
            bash scripts/deploy-ftps.sh
          fi
