name: Deploy PHP via SFTP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lexgalleri-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SFTP_HOST: ${{ vars.SFTP_HOST || secrets.SFTP_HOST }}
      SFTP_USERNAME: ${{ vars.SFTP_USERNAME || secrets.SFTP_USERNAME }}
      SFTP_PORT: ${{ vars.SFTP_PORT || secrets.SFTP_PORT || '22' }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS || secrets.SFTP_KNOWN_HOSTS }}
      SFTP_PUBLIC_PATH: ${{ vars.SFTP_PUBLIC_PATH || '/home/lexandkk/public_html/LexGalleri' }}
      SFTP_PRIVATE_PATH: ${{ vars.SFTP_PRIVATE_PATH || '/home/lexandkk/lexgalleri-private' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate connection settings without displaying them
        run: node scripts/sftp-plan.mjs "$RUNNER_TEMP/lexgalleri-sftp-preflight"
      - name: Install SFTP password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Transfer code files via SFTP
        run: bash scripts/deploy-sftp.sh
