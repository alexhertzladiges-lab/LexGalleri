name: Install requested LexGalleri gallery date layout
on:
  push:
    branches: [feature/lexgalleri-gallery-date-layout-v1]
    paths: [.github/workflows/install-gallery-date-layout-public.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: lexgalleri-production
  cancel-in-progress: false
jobs:
  install:
    # Request completed: successful installation run 41823659759, job 126552801586.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPROVED_SOURCE: 96094e9c0d68d2a7a922b2e27389fd25612e2a3a
      APPROVED_RUN: '41823053945'
      APPROVED_ARTIFACT: '13316889178'
      APPROVED_DIGEST: ac77f1ad3a2bce421d56d8742c2b26bac00be5eb14858a5e9f67f2393c940c19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96094e9c0d68d2a7a922b2e27389fd25612e2a3a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify green source and exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN" > "$RUNNER_TEMP/approved-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APPROVED_ARTIFACT" > "$RUNNER_TEMP/approved-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APPROVED_ARTIFACT/zip" > "$RUNNER_TEMP/approved-package.zip"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root/'approved-run.json').read_text())
          artifact = json.loads((root/'approved-artifact.json').read_text())
          assert run['head_sha'] == os.environ['APPROVED_SOURCE']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/tests.yml'
          assert artifact['workflow_run']['id'] == int(os.environ['APPROVED_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['APPROVED_SOURCE']
          assert artifact['expired'] is False
          digest = 'sha256:' + os.environ['APPROVED_DIGEST']
          assert artifact['digest'] == digest
          assert 'sha256:' + hashlib.sha256((root/'approved-package.zip').read_bytes()).hexdigest() == digest
          expected = {str(p) for p in Path('public').rglob('*') if p.is_file()}
          assert len(expected) == 12
          expected |= {'INSTALLER.md'}
          with zipfile.ZipFile(root/'approved-package.zip') as archive:
              assert len(archive.namelist()) == 14
              assert set(archive.namelist()) == expected | {'SHA256SUMS'}
              manifest = {}
              for line in archive.read('SHA256SUMS').decode().splitlines():
                  digest_line, name = line.split('  ', 1)
                  assert name not in manifest
                  manifest[name] = digest_line
              assert set(manifest) == expected
              for name in expected:
                  content = archive.read(name)
                  assert hashlib.sha256(content).hexdigest() == manifest[name], name
                  source = 'installation/gallery-date-layout/INSTALLER.md' if name == 'INSTALLER.md' else name
                  assert content == Path(source).read_bytes(), name
          baseline = json.loads(Path('installation/gallery-bulk-metadata/public-installed.json').read_text())['public_sha256']
          for name, digest_line in baseline.items():
              if name != 'static/app.js':
                  assert hashlib.sha256((Path('public')/name).read_bytes()).hexdigest() == digest_line, name
          private_digest = json.loads(Path('installation/gallery-bulk-metadata/release.json').read_text())['private_file_sha256']
          assert hashlib.sha256(Path('private/app.php').read_bytes()).hexdigest() == private_digest
          print('PASS: green source, exact public-only artifact, all13 manifest entries; only public/static/app.js changes runtime')
          PY
          node --test tests/ftps-plan.test.mjs
          bash -n scripts/deploy-ftps.sh
      - name: Confirm current backend is compatible before public changes
        run: |
          python3 - <<'PY'
          import json, urllib.request
          request = urllib.request.Request('https://lexan.dk/lexgalleri/api/status', headers={'Cache-Control':'no-cache','User-Agent':'LexGalleri-install-verification'})
          with urllib.request.urlopen(request, timeout=30) as reply:
              assert reply.status == 200
              assert reply.url.startswith('https://lexan.dk/lexgalleri/')
              assert "media-src 'self' blob:" in reply.headers.get('Content-Security-Policy','')
              status = json.loads(reply.read())
          evidence = {
              'application':'LexGalleri', 'url':reply.url,
              'setup':status.get('setup'),
              'account_security_ready':status.get('account_security_ready'),
              'capabilities':{key:status.get('capabilities',{}).get(key) for key in ['storage_overview','member_gallery_sharing','gallery_delete','gallery_delete_requests','gallery_bulk_metadata']},
              'production_mutations_performed':False,
          }
          from pathlib import Path
          import os
          (Path(os.environ['RUNNER_TEMP'])/'backend-preflight.json').write_text(json.dumps(evidence, indent=2)+'\n')
          print('Backend preflight:', json.dumps(evidence, sort_keys=True))
          assert status.get('setup') is False
          assert status.get('account_security_ready') is True
          assert status.get('capabilities',{}).get('storage_overview') is True, 'Den private app.php er ikke klar til pladsoversigten'
          assert status.get('capabilities',{}).get('member_gallery_sharing') is True, 'Upload den private app.php fra den godkendte medlemsdelingspakke med rettighed 0600 foer offentlig installation'
          assert status.get('capabilities',{}).get('gallery_delete') is True, 'PRIVATE_BACKEND_REQUIRED: upload approved private/app.php to /home/lexandkk/lexgalleri-private/app.php with 0600; no public changes performed'
          assert status.get('capabilities',{}).get('gallery_delete_requests') is True, 'PRIVATE_BACKEND_REQUIRED: approved private backend must support member deletion requests'
          assert status.get('capabilities',{}).get('gallery_bulk_metadata') is True, 'PRIVATE_BACKEND_REQUIRED: upload pinned private/app.php to /home/lexandkk/lexgalleri-private/app.php with 0600 before public installation'
          print('PASS: private backend supports reviewed gallery metadata, deletion, sharing and media budget')
          PY
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Install and read back only the 12 approved public files
        env:
          FTPS_HOST: ${{ vars.FTPS_HOST }}
          FTPS_USERNAME: ${{ vars.FTPS_USERNAME }}
          FTPS_PORT: ${{ vars.FTPS_PORT }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
        run: bash scripts/deploy-ftps.sh
      - name: Verify public HTTP responses and installed JavaScript
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          base = 'https://lexan.dk/lexgalleri/'
          def get(path):
              request = urllib.request.Request(base + path, headers={'Cache-Control':'no-cache', 'User-Agent':'LexGalleri-install-verification'})
              with urllib.request.urlopen(request, timeout=30) as reply:
                  assert reply.status == 200
                  assert reply.url.startswith(base)
                  return reply.read()
          script = get('static/app.js?bulk=' + os.environ['APPROVED_SOURCE'])
          assert b'function bulkGalleryMetadata(' in script and b'function groupTimelinePhotos(' in script
          assert b'function photoDateValue(' in script and b'function refreshTimelineCounts(' in script
          assert script.count('Markér billeder til sletning'.encode()) == 4
          html = get('')
          assert b'LexGalleri' in html and b'/static/app.js' in html
          expected = hashlib.sha256(Path('public/static/app.js').read_bytes()).hexdigest()
          actual = hashlib.sha256(get('static/app.js?verify=' + os.environ['APPROVED_SOURCE'])).hexdigest()
          assert actual == expected
          assert hashlib.sha256(get('static/style.css?verify=' + os.environ['APPROVED_SOURCE'])).hexdigest() == hashlib.sha256(Path('public/static/style.css').read_bytes()).hexdigest()
          status = json.loads(get('api/status'))
          assert status.get('setup') is False
          assert status.get('account_security_ready') is True
          assert status.get('account_security_version') == 1
          assert status.get('capabilities',{}).get('storage_overview') is True
          assert status.get('capabilities',{}).get('member_gallery_sharing') is True
          assert status.get('capabilities',{}).get('gallery_delete') is True
          assert status.get('capabilities',{}).get('gallery_delete_requests') is True
          assert status.get('capabilities',{}).get('gallery_bulk_metadata') is True
          evidence = {'http_gallery_date_layout_assets':'PASS', 'source_commit':os.environ['APPROVED_SOURCE'], 'approved_artifact':os.environ['APPROVED_ARTIFACT'], 'approved_artifact_sha256':os.environ['APPROVED_DIGEST'], 'installed_public_files':12, 'ftps_sha256_readback':'PASS', 'http_entry':'PASS', 'http_app_js_sha256':'PASS', 'http_style_css_sha256':'PASS', 'http_account_security':'PASS', 'capabilities':status.get('capabilities',{}), 'private_files_changed':False, 'sql_migrations_run':False, 'workflow_run':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          evidence['public_sha256'] = {str(p.relative_to('public')):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('public').rglob('*') if p.is_file()}
          target = Path(os.environ['RUNNER_TEMP'])/'public-installation-evidence.json'
          target.write_text(json.dumps(evidence, indent=2)+'\n')
          print('PASS: public entry, installed JavaScript/CSS SHA-256, account security, gallery-deletion, member requests, sharing and storage capabilities')
          print('Capabilities:', json.dumps(evidence['capabilities'], sort_keys=True))
          PY
      - name: Preserve non-sensitive backend preflight result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lexgalleri-gallery-date-layout-backend-preflight
          path: ${{ runner.temp }}/backend-preflight.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: lexgalleri-gallery-date-layout-installation-evidence
          path: ${{ runner.temp }}/public-installation-evidence.json
          if-no-files-found: error
          retention-days: 30

