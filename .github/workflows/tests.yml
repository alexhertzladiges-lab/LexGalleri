name: PHP 8.4 and MySQL
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, exif, zip, mbstring, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FTPS and Apache clients for local protocol tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp apache2
      - name: PHP syntax
        run: find public private tests hosting -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: MySQL integration tests
        env:
          LEXGALLERI_TEST: '1'
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php tests/run.php
          php tests/account-security.php
          php tests/media-delete.php
          php tests/media-delete-requests.php
          php tests/theme-delete.php
          php tests/gallery-create.php
          php tests/asset-version.php
          php tests/routing.php
          php tests/lychee-import.php
          php tests/lychee-move.php
          php tests/lychee-video.php
      - run: node --check public/static/app.js
      - run: node --check public/static/pwa.js
      - run: node --check public/service-worker.js
      - run: node --test tests/ftps-plan.test.mjs
      - run: node --test tests/routing.test.mjs
      - run: node --test tests/ftps-client.test.mjs
      - run: node --test tests/lychee-ui.test.mjs
      - run: node --test tests/account-ui.test.mjs
      - run: node --test tests/webapp.test.mjs
      - name: Browser checks with Chrome
        run: |
          task_browser_binary="$(command -v google-chrome || command -v chromium)"
          test -n "$task_browser_binary"
          TEST_BROWSER="$task_browser_binary" node --test tests/webapp-browser.test.mjs
      - name: Account login and profile browser checks
        env:
          LEXGALLERI_TEST: '1'
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          task_browser_binary="$(command -v google-chrome || command -v chromium)"
          test -n "$task_browser_binary"
          TEST_BROWSER="$task_browser_binary" node --test tests/account-browser.test.mjs
      - run: bash -n scripts/deploy-ftps.sh
